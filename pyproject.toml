[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dimmery"
version = "0.1.0"
description = "Brightness that learns your habits for an external monitor over DDC/CI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "circularnatural" }]
keywords = ["brightness", "ddc", "ddcutil", "monitor", "linux"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]
dependencies = []

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
dimmery = "dimmery.main:main"

[project.urls]
Homepage = "https://github.com/circularnatural/dimmery"
Issues = "https://github.com/circularnatural/dimmery/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/dimmery/gui.py" = ["N802"]  # Qt overrides are camelCase
